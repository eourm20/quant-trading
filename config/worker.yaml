# Worker runtime config
worker:
  interval_seconds: 600
  entry_interval_seconds: 600
  exit_interval_seconds: 60
  sync_realtime_minutes: 10
  news_cooldown_hours: 8
  use_ai_judgment: true
  use_agent_mode: true
  # Role-based model routing (OpenAI-compatible API).
  # 운영 기본값은 기존 GPT 계열을 유지하고, 필요 시 아래 3개 키를 역할별로 교체하세요.
  # 예시(판단=DeepSeek): judgment_agent_model: "deepseek-chat"
  # 예시(검증/리서치=Qwen): research_agent_model: "qwen-max"
  # 예시(외부 provider): *_agent_base_url, *_agent_api_key 설정
  # Single-agent style operation: use one model across judgment/research.
  judgment_agent_model: "gpt-4.1"
  judgment_agent_base_url: ""
  judgment_agent_api_key: ""
  research_agent_model: "gpt-4.1-mini"
  research_agent_base_url: ""
  research_agent_api_key: ""
  ai_cache_minutes: 180
  buy_reentry_block_minutes: 60
  semi_force_transition_auto_trade: true
  news_ai_max_calls_per_run: 1
  # 429/TPM 완화: 판단 Agent 토큰/스텝/재시도 텀 보수화
  agent_max_steps: 7
  agent_max_tokens: 600
  agent_target_unique_tools: 5
  agent_rate_limit_retries: 2
  agent_rate_limit_wait_seconds: 4
  research_agent_max_steps: 30
  research_agent_max_tokens: 700
  research_agent_target_unique_tools: 3
  research_agent_rate_limit_retries: 2
  research_agent_rate_limit_wait_seconds: 4
  research_max_candidates: 4
  news_monitor_times: "8:55,12:00"
  rag_realtime_index: false
  rag_batch_times: "8:55,13:05,16:05"
  rag_batch_hours: ""
  rag_batch_minute: 5
  rag_batch_size: 100
  rag_batch_max_signals: 100
  rag_batch_run_close: false
  dip_buy_threshold: -1.5
  dip_buy_max_stocks: 2
  dip_buy_cooldown_hours: 6
  weak_exit_confirm_minutes: 20
  weak_exit_partial_ratio: 0.5
  # qty 누락 시 정책: hold | fallback
  missing_qty_policy: fallback
  # fallback 매수 시 주문가능금액 대비 비중
  fallback_buy_ratio: 0.10
  min_target_profit_pct: 2.0
  min_target_profit_krw: 100
  strong_exit_condition_ids: "stop_loss_price,target_price,ma20_support_break,death_cross,macd_death_cross,ichimoku_death_cross,ichimoku_cloud_breakdown,stochastic_death_cross"
  strategy_tuning:
    min_samples: 10
    auto_apply_low_risk: true

watchlist_management:
  inactive_days_alert: 30
  inactive_days_removal: 5
  alert_interval_days: 7

sector:
  max_holdings: 3

prefilter:
  market_cap_min: 500
  change_upper: 5
  change_lower: -10
  rsi_max: 67
  ma_ratio: 0.95
  volume_ratio_min: 2.2
  volume_ratio_max: 15
  consecutive_candles: 5

  # Market regime adaptive thresholds
  skip_bull_threshold: 5.0
  market_bull_threshold: 2.0
  market_bear_threshold: -2.0
  bull_change_upper_add: 4.0
  bull_consecutive_sub: 2
  bear_change_lower_sub: 3.0
  bear_change_upper_add: 6.0
  bear_rsi_max_add: 5.0
  bear_ma_ratio_sub: 0.07
  bear_consecutive_disable: true
  prefilter_input_cap: 25
  prefilter_fallback_candidates: 5
  max_ai_candidates: 12

# KRX session notes (see worker/main.py _SESSIONS)
# Pre-open: 08:30~09:00 trde_tp=61
# Regular: 09:00~15:30 trde_tp=0/3
# Closing auction: 15:40~16:00 trde_tp=81
# After-hours single-price: 16:00~18:00 trde_tp=62
