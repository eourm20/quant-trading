# Worker runtime config
worker:
  interval_seconds: 600
  sync_realtime_minutes: 10
  news_cooldown_hours: 8
  use_ai_judgment: true
  use_agent_mode: true
  ai_cache_minutes: 180
  news_ai_max_calls_per_run: 2
  agent_max_steps: 7
  agent_max_tokens: 700
  agent_target_unique_tools: 6
  research_agent_max_steps: 10
  research_agent_max_tokens: 1200
  research_agent_target_unique_tools: 4
  research_max_candidates: 5
  news_monitor_times: "8:55,12:00"
  rag_realtime_index: false
  rag_batch_times: "8:55,13:05,16:05"
  rag_batch_hours: ""
  rag_batch_minute: 5
  rag_batch_size: 100
  rag_batch_max_signals: 100
  rag_batch_run_close: false
  dip_buy_threshold: -1.5
  dip_buy_max_stocks: 2
  dip_buy_cooldown_hours: 6
  weak_exit_confirm_minutes: 20
  weak_exit_partial_ratio: 0.5
  strong_exit_condition_ids: "stop_loss_price,target_price,ma20_support_break,death_cross,macd_death_cross,ichimoku_death_cross,ichimoku_cloud_breakdown,stochastic_death_cross"
  strategy_tuning:
    min_samples: 10
    auto_apply_low_risk: true

watchlist_management:
  inactive_days_alert: 30
  inactive_days_removal: 90
  alert_interval_days: 7

sector:
  max_holdings: 3

prefilter:
  market_cap_min: 500
  change_upper: 7
  change_lower: -10
  rsi_max: 70
  ma_ratio: 0.95
  volume_ratio_min: 2.0
  volume_ratio_max: 15
  consecutive_candles: 5

  # Market regime adaptive thresholds
  skip_bull_threshold: 5.0
  market_bull_threshold: 2.0
  market_bear_threshold: -2.0
  bull_change_upper_add: 4.0
  bull_consecutive_sub: 2
  bear_change_lower_sub: 3.0
  bear_change_upper_add: 6.0
  bear_rsi_max_add: 5.0
  bear_ma_ratio_sub: 0.07
  bear_consecutive_disable: true
  prefilter_input_cap: 25
  prefilter_fallback_candidates: 5
  max_ai_candidates: 10

# KRX session notes (see worker/main.py _SESSIONS)
# Pre-open: 08:30~09:00 trde_tp=61
# Regular: 09:00~15:30 trde_tp=0/3
# Closing auction: 15:40~16:00 trde_tp=81
# After-hours single-price: 16:00~18:00 trde_tp=62
