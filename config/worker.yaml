# 워커 전역 설정 (종목/조건은 DB에서 관리 — quant_watchlist_* / quant_condition_* 도구 사용)
worker:
  interval_seconds: 60         # 시세 조회 주기 (초)
  use_claude_api: true         # 조건 충족 시 Claude API 판단 여부
  claude_model: "claude-sonnet-4-6"
  use_agent_mode: true        # true로 전환하면 Tool Use Agent 모드 활성화 (기본: 레거시 프롬프트 스터핑)
  dip_buy_threshold: -1.5      # 시장 급락 감지 기준 (KOSPI 또는 KOSDAQ 등락률 %)
  dip_buy_max_stocks: 2        # 급락 스캔 시 최대 매수 종목 수
  dip_buy_cooldown_hours: 2    # 급락 스캔 재실행 최소 간격 (시간)

watchlist_management:
  inactive_days_alert: 30       # 신호 미발동 시 알림 기준 (일)
  inactive_days_removal: 90     # 미보유 종목 자동 삭제 기준 (일)
  alert_interval_days: 7        # 미발동 알림 재발송 간격 (일)

sector:
  max_holdings: 3            # 동일 섹터 최대 보유 종목 수 (초과 시 AI 경고)

prefilter:
  market_cap_min: 500           # 시가총액 최소 (억 원)
  change_upper: 7               # 등락률 상단 제외 기준 (%)
  change_lower: -10             # 등락률 하단 제외 기준 (%)
  rsi_max: 70                   # RSI 상단 제외 기준
  ma_ratio: 0.95                # MA5/MA20 역배열 허용 비율 (1.0 = 역배열 미허용, 0.95 = 5% 이상 역배열만 제외)
  volume_ratio_min: 2.0         # 거래량 비율 하단 제외 기준 (20일 평균 대비, 배) — 급증 아닌 종목 제외
  volume_ratio_max: 15          # 거래량 비율 상단 제외 기준 (배)
  consecutive_candles: 5        # 연속 양봉 제외 기준 (일)

  # 시장 상황별 자동 조정 (KOSPI·KOSDAQ 평균 등락률 기준)
  skip_bull_threshold: 5.0      # 시장 급등일 스크리닝 생략 기준 (평균 등락률 %)
  market_bull_threshold: 2.0    # 강세장 기준 (평균 등락률 %)
  market_bear_threshold: -2.0   # 약세장 기준 (평균 등락률 %)
  bull_change_upper_add: 4.0    # 강세장 시 등락률 상단 +N% 완화
  bull_consecutive_sub: 2       # 강세장 시 연속양봉 기준 -N일 완화
  bear_change_lower_sub: 3.0    # 약세장 시 등락률 하단 -N% 완화 (더 하락한 종목 포함)
  bear_change_upper_add: 6.0    # 약세장 시 등락률 상단 +N% 완화 (7% → 13%, 폭락장 역행 강세 종목 포함)
  bear_rsi_max_add: 5.0         # 약세장 시 RSI 상단 +N 완화
  bear_ma_ratio_sub: 0.07       # 약세장 시 MA역배열 허용 완화 (0.95 → 0.88, 12% 역배열까지 허용)
  bear_consecutive_disable: true  # 약세장 시 연속양봉 체크 비활성화 (폭락장 역행 강세 = 강한 종목)
  max_ai_candidates: 10           # 프리필터 통과 후 AI 분석 상한 (hts 우선순위)

# KRX 거래 세션 (참고용 — 실제 로직은 worker/main.py _SESSIONS 에서 관리)
# 프리장(장전 시간외): 08:30~09:00  trde_tp=61  (exit/add/both 조건만)
# 정규장:             09:00~15:30  trde_tp=0/3 (전체 조건)
# 애프터장(장후 시간외): 15:40~16:00  trde_tp=81  (exit/add/both 조건만)
# 시간외 단일가:       16:00~18:00  trde_tp=62  (exit/add/both 조건만)
