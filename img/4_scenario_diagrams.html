<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시나리오별 프로세스 다이어그램 v3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f9f8f5;
    color: #1a1a18;
    padding: 24px;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    text-align: center;
    margin-bottom: 16px;
    color: #1a1a18;
  }
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stab {
    padding: 6px 14px;
    border: 1px solid #c8c6bc;
    border-radius: 6px;
    background: transparent;
    color: #5f5e5a;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .stab.on {
    background: #e6f1fb;
    color: #185fa5;
    border-color: #85b7eb;
  }
  .sc { display: none; }
  .sc.on { display: block; }

  svg { display: block; width: 100%; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  svg .th { font-size: 14px; font-weight: 500; fill: #1a1a18; }
  svg .ts { font-size: 12px; font-weight: 400; fill: #5f5e5a; }

  svg .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  svg .c-purple .th { fill: #3C3489; }
  svg .c-purple .ts { fill: #534AB7; }

  svg .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  svg .c-teal .th { fill: #085041; }
  svg .c-teal .ts { fill: #0F6E56; }

  svg .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  svg .c-blue .th { fill: #0C447C; }
  svg .c-blue .ts { fill: #185FA5; }

  svg .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
  svg .c-amber .th { fill: #633806; }
  svg .c-amber .ts { fill: #854F0B; }

  svg .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  svg .c-coral .th { fill: #712B13; }
  svg .c-coral .ts { fill: #993C1D; }

  svg .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  svg .c-gray .th { fill: #444441; }
  svg .c-gray .ts { fill: #5F5E5A; }

  @media (prefers-color-scheme: dark) {
    body { background: #1a1a18; color: #e8e6de; }
    h1 { color: #e8e6de; }
    .stab { border-color: #444441; color: #b4b2a9; }
    .stab.on { background: #042C53; color: #B5D4F4; border-color: #378ADD; }

    svg .th { fill: #e8e6de; }
    svg .ts { fill: #b4b2a9; }

    svg .c-purple rect { fill: #26215C; stroke: #AFA9EC; }
    svg .c-purple .th { fill: #CECBF6; }
    svg .c-purple .ts { fill: #AFA9EC; }

    svg .c-teal rect { fill: #04342C; stroke: #5DCAA5; }
    svg .c-teal .th { fill: #9FE1CB; }
    svg .c-teal .ts { fill: #5DCAA5; }

    svg .c-blue rect { fill: #042C53; stroke: #85B7EB; }
    svg .c-blue .th { fill: #B5D4F4; }
    svg .c-blue .ts { fill: #85B7EB; }

    svg .c-amber rect { fill: #412402; stroke: #EF9F27; }
    svg .c-amber .th { fill: #FAC775; }
    svg .c-amber .ts { fill: #EF9F27; }

    svg .c-coral rect { fill: #4A1B0C; stroke: #F0997B; }
    svg .c-coral .th { fill: #F5C4B3; }
    svg .c-coral .ts { fill: #F0997B; }

    svg .c-gray rect { fill: #2C2C2A; stroke: #888780; }
    svg .c-gray .th { fill: #D3D1C7; }
    svg .c-gray .ts { fill: #888780; }
  }
</style>
</head>
<body>

<h1>④ 시나리오별 프로세스</h1>

<div class="tabs">
  <button class="stab on" onclick="sw('a',this)">신호 발생 → 알림</button>
  <button class="stab" onclick="sw('b',this)">미보유 entry 신호</button>
  <button class="stab" onclick="sw('c',this)">보유 exit 신호</button>
  <button class="stab" onclick="sw('d',this)">주문 실행</button>
  <button class="stab" onclick="sw('e',this)">조회 명령</button>
  <button class="stab" onclick="sw('f',this)">조건 변경</button>
  <button class="stab" onclick="sw('g',this)">조건 추가</button>
</div>

<!-- S1: 신호 발생 → 알림 -->
<div id="a" class="sc on">
<svg viewBox="0 0 680 500">
<defs><marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340" y="20" text-anchor="middle">워커 1분 체크 → signal_type 필터링 → 쿨다운 → AI 판단 → 텔레그램 알림</text>
<g class="c-gray"><rect x="240" y="36" width="200" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="56" text-anchor="middle" dominant-baseline="central">워커 1분 체크 시작</text></g>
<line x1="340" y1="76" x2="340" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arr-a)"/>
<g class="c-blue"><rect x="180" y="100" width="320" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="120" text-anchor="middle" dominant-baseline="central">키움 API → 현재가 + 40일 일봉 조회</text></g>
<line x1="340" y1="140" x2="340" y2="164" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr-a)"/>
<g class="c-blue"><rect x="180" y="164" width="320" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="184" text-anchor="middle" dominant-baseline="central">지표 계산 · RSI / MA / MACD / 볼린저</text></g>
<line x1="340" y1="204" x2="340" y2="228" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr-a)"/>
<g class="c-blue"><rect x="140" y="228" width="400" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="248" text-anchor="middle" dominant-baseline="central">signal_type 필터링 + 조건 평가</text>
<text class="ts" x="340" y="267" text-anchor="middle" dominant-baseline="central">보유 → exit/both 조건만 · 미보유 → entry/both 조건만</text></g>
<line x1="340" y1="280" x2="340" y2="304" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr-a)"/>
<g class="c-gray"><rect x="180" y="304" width="320" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="324" text-anchor="middle" dominant-baseline="central">쿨다운 확인 → 조건별 중복 방지</text></g>
<line x1="340" y1="344" x2="340" y2="368" stroke="#888780" stroke-width="1.5" marker-end="url(#arr-a)"/>
<g class="c-amber"><rect x="180" y="368" width="320" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="388" text-anchor="middle" dominant-baseline="central">AI 판단 · ANTHROPIC → Claude / OPENAI → GPT</text></g>
<line x1="340" y1="408" x2="340" y2="432" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr-a)"/>
<g class="c-teal"><rect x="140" y="432" width="400" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="452" text-anchor="middle" dominant-baseline="central">텔레그램 발송 → 사용자</text>
<text class="ts" x="340" y="471" text-anchor="middle" dominant-baseline="central">메시지1: 신호 요약 · 메시지2: AI 의견 · signals DB 저장</text></g>
</svg>
</div>

<!-- S2: 미보유 entry 신호 → 매수 검토 -->
<div id="b" class="sc">
<svg viewBox="0 0 680 410">
<defs><marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340" y="20" text-anchor="middle">미보유 종목 entry 신호 수신 → 매수 검토 → 주문 or 홀드</text>
<g class="c-teal"><rect x="160" y="36" width="360" height="52" rx="8" stroke-width="0.5"/>

<text class="ts" x="340" y="71" text-anchor="middle" dominant-baseline="central">골든크로스 / RSI 과매도 / MACD 골든크로스 등</text></g>
<line x1="340" y1="88" x2="340" y2="112" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr-b)"/>
<g class="c-purple"><rect x="200" y="112" width="280" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="132" text-anchor="middle" dominant-baseline="central">사용자 → Claude: "이 종목 살까?"</text></g>
<line x1="340" y1="152" x2="340" y2="176" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr-b)"/>
<g class="c-amber"><rect x="140" y="176" width="400" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="196" text-anchor="middle" dominant-baseline="central">quant_report(signals) + quant_watchlist_read()</text>
<text class="ts" x="340" y="211" text-anchor="middle" dominant-baseline="central">최근 신호 확인 · 목표가 / 손절가 / 조건값 확인</text></g>
<line x1="340" y1="228" x2="340" y2="252" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr-b)"/>
<g class="c-blue"><rect x="180" y="252" width="320" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="272" text-anchor="middle" dominant-baseline="central">매수 검토 · 지표 + AI 의견 종합</text></g>
<line x1="280" y1="292" x2="172" y2="336" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="400" y1="292" x2="508" y2="336" stroke="#888780" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text class="ts" x="196" y="322" text-anchor="middle" fill="#712B13">매수 결정</text>
<text class="ts" x="484" y="322" text-anchor="middle" fill="#444441">홀드</text>
<g class="c-coral"><rect x="48" y="336" width="240" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="168" y="356" text-anchor="middle" dominant-baseline="central">주문 실행 시나리오</text>
<text class="ts" x="168" y="371" text-anchor="middle" dominant-baseline="central">kiwoom_execute_api → 매수 주문</text></g>
<g class="c-gray"><rect x="392" y="336" width="240" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="512" y="356" text-anchor="middle" dominant-baseline="central">Claude 홀드 의견 답변</text>
<text class="ts" x="512" y="371" text-anchor="middle" dominant-baseline="central">재진입 기준 / 다음 신호 대기 안내</text></g>
</svg>
</div>

<!-- S3: 보유 exit 신호 → 매도 검토 -->
<div id="c" class="sc">
<svg viewBox="0 0 680 410">
<defs><marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340" y="20" text-anchor="middle">보유 종목 exit 신호 수신 → 매도 검토 → 주문 or 홀드</text>
<g class="c-teal"><rect x="160" y="36" width="360" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="56" text-anchor="middle" dominant-baseline="central">텔레그램 수신 · 보유 종목 exit 신호</text>
<text class="ts" x="340" y="71" text-anchor="middle" dominant-baseline="central">목표가 도달 / 손절가 도달 / 데드크로스 / MA 이탈 등</text></g>
<line x1="340" y1="88" x2="340" y2="112" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr-c)"/>
<g class="c-purple"><rect x="200" y="112" width="280" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="132" text-anchor="middle" dominant-baseline="central">사용자 → Claude: "팔아야 해?"</text></g>
<line x1="340" y1="152" x2="340" y2="176" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr-c)"/>
<g class="c-amber"><rect x="140" y="176" width="400" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="196" text-anchor="middle" dominant-baseline="central">quant_report(portfolio) + quant_watchlist_read()</text>
<text class="ts" x="340" y="211" text-anchor="middle" dominant-baseline="central">보유 수량 · 수익률 · 목표가 / 손절가 확인</text></g>
<line x1="340" y1="228" x2="340" y2="252" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr-c)"/>
<g class="c-blue"><rect x="180" y="252" width="320" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="272" text-anchor="middle" dominant-baseline="central">매도 검토 · 신호 + 수익률 + AI 의견 종합</text></g>
<line x1="280" y1="292" x2="172" y2="336" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arr-c)"/>
<line x1="400" y1="292" x2="508" y2="336" stroke="#888780" stroke-width="1.5" marker-end="url(#arr-c)"/>
<text class="ts" x="196" y="322" text-anchor="middle" fill="#712B13">매도 결정</text>
<text class="ts" x="484" y="322" text-anchor="middle" fill="#444441">홀드</text>
<g class="c-coral"><rect x="48" y="336" width="240" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="168" y="356" text-anchor="middle" dominant-baseline="central">주문 실행 시나리오</text>
<text class="ts" x="168" y="371" text-anchor="middle" dominant-baseline="central">kiwoom_execute_api → 매도 주문</text></g>
<g class="c-gray"><rect x="392" y="336" width="240" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="512" y="356" text-anchor="middle" dominant-baseline="central">Claude 홀드 의견 답변</text>
<text class="ts" x="512" y="371" text-anchor="middle" dominant-baseline="central">추가 하락 시 손절 기준 / 홀드 근거</text></g>
</svg>
</div>

<!-- S4: 주문 실행 -->
<div id="d" class="sc">
<svg viewBox="0 0 680 540">
<defs><marker id="arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340" y="20" text-anchor="middle">"삼성전자 200주 매수" → kiwoom-mcp → 키움 API → 체결 → 자동 기록</text>
<g class="c-purple"><rect x="200" y="36" width="280" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="56" text-anchor="middle" dominant-baseline="central">"삼성전자 200주 매수"</text></g>
<line x1="340" y1="76" x2="340" y2="100" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr-d)"/>
<g class="c-blue"><rect x="200" y="100" width="280" height="40" rx="8" stroke-width="0.5"/>

<line x1="340" y1="140" x2="340" y2="164" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr-d)"/>
<g class="c-teal"><rect x="180" y="164" width="320" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="184" text-anchor="middle" dominant-baseline="central">kiwoom-mcp: kiwoom_execute_api</text></g>

<g class="c-coral"><rect x="140" y="228" width="400" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="248" text-anchor="middle" dominant-baseline="central">키움 REST API 주문 전송</text>

<line x1="340" y1="280" x2="340" y2="304" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arr-d)"/>

<text class="th" x="172" y="484" text-anchor="middle" dominant-baseline="central">Claude 체결 답변</text>
<text class="ts" x="172" y="499" text-anchor="middle" dominant-baseline="central">"200주 체결 완료 (₩73,400)"</text></g>
<g class="c-teal"><rect x="384" y="464" width="248" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="508" y="484" text-anchor="middle" dominant-baseline="central">텔레그램 매매 알림</text>
<text class="ts" x="508" y="499" text-anchor="middle" dominant-baseline="central">전략 노트 기록 + DB 동기화 완료</text></g>
</svg>
</div>

<!-- S5: 조회 명령 -->
<div id="e" class="sc">
<svg viewBox="0 0 680 390">
<defs><marker id="arr-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340" y="20" text-anchor="middle">"오늘 신호 뭐 왔어?" → quant-mcp → DB 조회 → Claude 요약 답변</text>
<g class="c-purple"><rect x="220" y="36" width="240" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="56" text-anchor="middle" dominant-baseline="central">"오늘 신호 뭐 왔어?"</text></g>
<line x1="340" y1="76" x2="340" y2="100" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr-e)"/>
<g class="c-blue"><rect x="200" y="100" width="280" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="120" text-anchor="middle" dominant-baseline="central">Claude Desktop 의도 파악</text></g>
<line x1="340" y1="140" x2="340" y2="164" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr-e)"/>
<g class="c-amber"><rect x="180" y="164" width="320" height="40" rx="8" stroke-width="0.5"/>
